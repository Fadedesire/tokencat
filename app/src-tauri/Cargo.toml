[package]
name = "tokencat"
version = "0.9.0"
description = "TokenCat — трекер лимитов для Claude (неофициальный)"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/Fadedesire/tokencat"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Версии те же, что прошли спайк S02 на ПК пользователя
# macos-private-api — прозрачное окно «Поверх окон» на macOS (S07); в Mac App Store не идём
# tray-icon — значок в трее / строке меню (B1)
tauri = { version = "2.4", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP к claude.ai. На Windows native-tls = системный Schannel, на macOS — Security.framework
# socks — прокси SOCKS5 из настроек (S05)
reqwest = { version = "0.12", features = ["gzip", "brotli", "json", "socks"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Ключ сессии — только в системном хранилище: Credential Manager / Keychain
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# Автозапуск по профилю (B1): Run-ключ в HKCU / LaunchAgent. Тот же crate, что внутри
# tauri-plugin-autostart, но плагин умеет только одну запись на программу.
auto-launch = "0.6"
# Язык системы для «Как в системе» (B3): маленький crate без зависимостей на Windows/macOS
sys-locale = "0.3"
# Автообновление из GitHub Releases с проверкой подписи (B4). TLS — системный, как у reqwest выше
# (native-tls), без второго TLS-стека rustls. zip — распаковка архивов обновлений.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
# Внутри updater свой reqwest 0.13 (наш — 0.12). Эта строка кода не добавляет, только включает
# ему SOCKS, чтобы проверка обновлений шла и через socks5-прокси из настроек.
# TODO: перейти на reqwest 0.13 в api.rs — уйдёт дубль (≈ −0,5 МБ exe).
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["socks"] }

# Системные уведомления (B1). Не плагин Tauri: он подменяет window.Notification во всех
# окнах, включая окно входа claude.ai.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
notify-rust = { version = "4.18", default-features = false }

# Windows: убрать панель из Alt+Tab (WS_EX_TOOLWINDOW, S07) и виджет в панели задач (B2:
# окно Win32 + рисование GDI, масштаб, тема из реестра). Версия уже есть в Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
] }
# B3: «меньше памяти, когда панель скрыта» (ICoreWebView2_19). Версии — те, что уже тянет Tauri.
webview2-com = "0.39"
windows-core = "0.62"

[profile.dev]
# Свой код собираем быстро, зависимости — с оптимизацией
[profile.dev.package."*"]
opt-level = 1

[profile.release]
# Лёгкость (SPEC): маленький exe важнее пары секунд сборки
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
