[package]
name = "tokencat"
version = "0.1.0"
description = "TokenCat — трекер лимитов для Claude (неофициальный)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Версии те же, что прошли спайк S02 на ПК пользователя
# macos-private-api — прозрачное окно «Поверх окон» на macOS (S07); в Mac App Store не идём
# tray-icon — значок в трее / строке меню (B1)
tauri = { version = "2.4", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP к claude.ai. На Windows native-tls = системный Schannel, на macOS — Security.framework
# socks — прокси SOCKS5 из настроек (S05)
reqwest = { version = "0.12", features = ["gzip", "brotli", "json", "socks"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Ключ сессии — только в системном хранилище: Credential Manager / Keychain
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# Автозапуск по профилю (B1): Run-ключ в HKCU / LaunchAgent. Тот же crate, что внутри
# tauri-plugin-autostart, но плагин умеет только одну запись на программу.
auto-launch = "0.6"

# Системные уведомления (B1). Не плагин Tauri: он подменяет window.Notification во всех
# окнах, включая окно входа claude.ai.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
notify-rust = { version = "4.18", default-features = false }

# Windows: убрать панель из Alt+Tab (WS_EX_TOOLWINDOW, S07) и виджет в панели задач (B2:
# окно Win32 + рисование GDI, масштаб, тема из реестра). Версия уже есть в Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.dev]
# Свой код собираем быстро, зависимости — с оптимизацией
[profile.dev.package."*"]
opt-level = 1

[profile.release]
# Лёгкость (SPEC): маленький exe важнее пары секунд сборки
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
