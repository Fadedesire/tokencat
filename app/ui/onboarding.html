<!doctype html>
<html lang="en" class="i18n">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenCat</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Онбординг первого запуска (B1, п. 7): язык (B3) и ОС → вид → вход → ранний старт (B9) → автозапуск.
       У добавленного аккаунта (второй профиль) — только вход и автозапуск.
       Логика — onboarding.js. -->
  <main class="onb">
    <div class="steps" id="steps"></div>

    <!-- 1. Привет, язык и система -->
    <section class="step" data-step="hello" hidden>
      <div class="hello">
        <canvas id="hello-cat" aria-hidden="true"></canvas>
        <div>
          <h1 data-i18n="onb.hello"></h1>
          <p class="lead" data-i18n="onb.hello_lead"></p>
        </div>
      </div>
      <div class="check lang-row">
        <div class="text"><span id="lang-en">Language · </span><span data-i18n="set.lang"></span></div>
        <select id="language"></select>
      </div>
      <div class="check">
        <div class="text"><span data-i18n="onb.os"></span> <b id="os-name"></b>
          <div class="muted small" data-i18n="onb.os_hint"></div>
        </div>
      </div>
    </section>

    <!-- 2. Вид -->
    <section class="step" data-step="view" hidden>
      <h1 data-i18n="onb.view"></h1>
      <p class="lead" data-i18n="onb.view_lead"></p>
      <div class="cards" id="cards"></div>
    </section>

    <!-- 3. Вход -->
    <section class="step" data-step="login" hidden>
      <h1 id="login-title" data-i18n="onb.login"></h1>
      <p class="lead" id="login-lead" data-i18n="onb.login_lead"></p>
      <div class="login-box">
        <button id="login" class="primary" data-i18n="login.btn"></button>
        <p id="login-msg" class="msg muted" hidden></p>
      </div>
    </section>

    <!-- 4. Ранний старт (B9): зачем, кому нужно, во сколько. По умолчанию вкл. -->
    <section class="step" data-step="early" hidden>
      <h1 data-i18n="onb.early"></h1>
      <p class="lead" data-i18n="onb.early_lead"></p>
      <div class="timeline" id="timeline" aria-hidden="true"></div>
      <div class="who">
        <div data-i18n-html="onb.early_yes"></div>
        <div data-i18n-html="onb.early_no"></div>
      </div>
      <div class="box" id="early-box"></div>
    </section>

    <!-- 5. Автозапуск -->
    <section class="step" data-step="autostart" hidden>
      <h1 data-i18n="onb.done"></h1>
      <p class="lead" data-i18n="onb.done_lead"></p>
      <label class="check">
        <span class="switch"><input id="autostart" type="checkbox" checked><i></i></span>
        <span data-i18n="onb.autostart"></span>
      </label>
      <p id="finish-msg" class="msg bad" hidden></p>
    </section>

    <div class="foot">
      <button id="back" class="link" hidden data-i18n="onb.back"></button>
      <span class="spacer"></span>
      <button id="skip" class="link" hidden data-i18n="onb.skip"></button>
      <button id="next" class="primary" data-i18n="onb.next"></button>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="cat.js"></script>
  <script src="components.js"></script>
  <script src="early.js"></script>
  <script src="catfacts.js"></script>
  <script src="earlyui.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
