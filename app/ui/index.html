<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenCat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Временный экран S04–S05: вход, данные от планировщика, настройки сети. Настоящий вид — S06/S07. -->
  <main class="card">
    <header>
      <canvas id="cat" width="20" height="16" aria-hidden="true"></canvas>
      <h1>TokenCat</h1>
    </header>

    <p id="message" class="message">Проверяю вход…</p>
    <p id="account" class="muted" hidden></p>

    <ul id="limits" class="limits" hidden></ul>
    <p id="status" class="muted small status"></p>
    <p id="log-link" class="small status" hidden><a href="#" id="open-log">Открыть лог</a></p>

    <div class="actions">
      <button id="login" class="primary" hidden>Войти в Claude</button>
      <button id="refresh" hidden>Обновить</button>
      <button id="logout" hidden>Выйти</button>
    </div>

    <details id="network">
      <summary>Обновление и сеть</summary>
      <label class="row small">Обновлять каждые
        <select id="interval"></select>
      </label>
      <label class="row small">Прокси (необязательно)
        <input id="proxy" type="text" spellcheck="false" autocomplete="off"
          placeholder="127.0.0.1:10808 или socks5://127.0.0.1:1080">
      </label>
      <div class="actions">
        <button id="net-save">Сохранить</button>
      </div>
      <p id="net-msg" class="small" hidden></p>
    </details>

    <details id="advanced">
      <summary>Продвинутое: вставить ключ вручную</summary>
      <p class="muted small">Значение cookie <code>sessionKey</code> с claude.ai. Нужен, только если
        обычный вход не работает.</p>
      <textarea id="manual" rows="2" spellcheck="false" autocomplete="off"
        placeholder="sk-ant-sid01-…"></textarea>
      <div class="actions">
        <button id="manual-save">Сохранить ключ</button>
      </div>
      <p id="manual-msg" class="small" hidden></p>
    </details>

    <p class="muted small footer">Неофициальная программа, не связана с Anthropic.</p>
  </main>
  <script src="cat.js"></script>
  <script src="main.js"></script>
</body>
</html>
