<!doctype html>
<html lang="en" class="i18n">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenCat</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Окно настроек (B1, по SPEC). Всё применяется сразу, без кнопки «Сохранить»
       (кроме прокси и ручного ключа: их сначала проверяем). Открывается из меню панели
       и значка в трее. Логика — settings.js. -->
  <main class="settings">
    <div id="panel-slot" class="panel-slot"></div>
    <p id="account-line" class="account-line muted small" hidden></p>
    <div class="actions">
      <button id="refresh" hidden data-i18n="set.refresh"></button>
      <button id="login" class="primary" hidden data-i18n="login.btn"></button>
    </div>

    <section class="group" id="account">
      <h2 data-i18n="acc.title"></h2>
      <div class="box">
        <div class="item">
          <div class="text">
            <span id="acc-name"></span>
            <small id="acc-hint"></small>
          </div>
          <button id="logout" hidden data-i18n="acc.logout"></button>
        </div>
        <div class="item">
          <div class="text"><span data-i18n="acc.add"></span>
            <small data-i18n="acc.add_hint"></small>
          </div>
          <button id="add-account" data-i18n="acc.add_btn"></button>
        </div>
        <div class="item col" id="remove-row" hidden>
          <div class="row-inline">
            <div class="text"><span data-i18n="acc.remove"></span>
              <small data-i18n="acc.remove_hint"></small>
            </div>
            <button id="remove" class="danger" data-i18n="acc.remove_btn"></button>
          </div>
          <div id="remove-confirm" class="confirm small" hidden>
            <span data-i18n="acc.remove_q"></span>
            <div class="actions left">
              <button id="remove-yes" class="danger" data-i18n="acc.remove_yes"></button>
              <button id="remove-no" data-i18n="common.cancel"></button>
            </div>
          </div>
        </div>
        <p id="acc-msg" class="msg item" hidden></p>
      </div>
    </section>

    <section class="group">
      <h2 data-i18n="set.view"></h2>
      <div class="box">
        <div class="item col">
          <div class="seg" id="views"></div>
        </div>
        <div class="item" id="menubar-row" hidden>
          <div class="text"><span data-i18n="set.menubar"></span>
            <small data-i18n="set.menubar_hint"></small>
          </div>
          <select id="menubar-style"></select>
        </div>
        <div class="item" id="on-top-row">
          <div class="text" data-i18n="set.on_top"></div>
          <label class="switch"><input id="on-top" type="checkbox"><i></i></label>
        </div>
        <div class="item">
          <div class="text"><span data-i18n="set.cat"></span>
            <small data-i18n="set.cat_hint"></small>
          </div>
          <label class="switch"><input id="show-cat" type="checkbox"><i></i></label>
        </div>
        <div class="item" id="cat-fact-row">
          <div class="text"><span data-i18n="set.fact"></span>
            <small data-i18n="set.fact_hint"></small>
          </div>
          <label class="switch"><input id="cat-fact" type="checkbox"><i></i></label>
        </div>
      </div>
    </section>

    <section class="group" id="early">
      <h2 data-i18n="early.title"></h2>
      <div class="box" id="early-box"></div>
      <p class="muted small hint" data-i18n="early.hint"></p>
    </section>

    <section class="group">
      <h2 data-i18n="set.updates"></h2>
      <div class="box">
        <div class="item">
          <div class="text" data-i18n="set.interval"></div>
          <select id="interval"></select>
        </div>
        <div class="item">
          <div class="text"><span data-i18n="set.notify"></span>
            <small><span data-i18n="set.notify_hint"></span>
              <button id="notify-test" class="link" data-i18n="set.notify_test"></button></small>
          </div>
          <label class="switch"><input id="notify" type="checkbox"><i></i></label>
        </div>
      </div>
    </section>

    <section class="group">
      <h2 data-i18n="set.system"></h2>
      <div class="box">
        <div class="item">
          <div class="text" data-i18n="set.autostart"></div>
          <label class="switch"><input id="autostart" type="checkbox"><i></i></label>
        </div>
        <div class="item">
          <div class="text"><span id="lang-en">Language · </span><span data-i18n="set.lang"></span>
            <small data-i18n="set.lang_hint"></small>
          </div>
          <select id="language"></select>
        </div>
        <p id="sys-msg" class="msg item" hidden></p>
      </div>
    </section>

    <section class="group">
      <h2 data-i18n="set.net"></h2>
      <div class="box">
        <div class="item col">
          <div class="text"><span data-i18n="set.proxy"></span> <small data-i18n="set.proxy_hint"></small></div>
          <div class="row-inline">
            <input id="proxy" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="set.proxy_ph">
            <button id="proxy-save" data-i18n="common.apply"></button>
          </div>
          <p id="net-msg" class="msg" hidden></p>
        </div>
      </div>
    </section>

    <section class="group">
      <details class="box" id="advanced">
        <summary data-i18n="set.advanced"></summary>
        <div class="item col">
          <div class="text"><span data-i18n="set.manual"></span>
            <small data-i18n-html="set.manual_hint"></small>
          </div>
          <textarea id="manual" rows="2" spellcheck="false" autocomplete="off" placeholder="sk-ant-sid01-…"></textarea>
          <div class="row-inline"><button id="manual-save" data-i18n="set.manual_save"></button></div>
          <p id="manual-msg" class="msg" hidden></p>
        </div>
        <div class="item">
          <div class="text"><span data-i18n="set.log"></span> <small data-i18n="set.log_hint"></small></div>
          <button id="open-log" data-i18n="common.open"></button>
        </div>
        <div class="item">
          <div class="text"><span data-i18n="set.onb"></span> <small data-i18n="set.onb_hint"></small></div>
          <button id="onboarding" data-i18n="set.onb_btn"></button>
        </div>
      </details>
    </section>

    <!-- Обновления (B4): статус, «Проверить», «Обновить и перезапустить» / «Скачать» -->
    <section class="group" id="about">
      <h2 data-i18n="upd.title"></h2>
      <div class="box">
        <div class="item">
          <div class="text"><span>TokenCat <span id="upd-current" class="version"></span></span>
            <small id="upd-text"></small>
          </div>
          <button id="upd-check" data-i18n="upd.check"></button>
        </div>
        <div class="item col" id="upd-avail" hidden>
          <div class="row-inline">
            <div class="text grow"><span id="upd-title"></span>
              <small id="upd-notes" class="pre"></small>
            </div>
            <button id="upd-install" class="primary"></button>
          </div>
          <progress id="upd-progress" max="100" value="0" hidden></progress>
          <p id="upd-msg" class="msg" hidden></p>
        </div>
        <div class="item">
          <div class="text"><span data-i18n="upd.auto"></span>
            <small data-i18n="upd.auto_hint"></small>
          </div>
          <label class="switch"><input id="auto-update" type="checkbox"><i></i></label>
        </div>
      </div>
    </section>

    <section class="about" id="support">
      <div class="actions">
        <button id="donate" class="primary" data-i18n="about.donate"></button>
        <button id="report" data-i18n="about.report"></button>
      </div>
      <p id="about-msg" class="msg muted" hidden></p>
      <p class="muted small">TokenCat <span id="version" class="version"></span> · <span data-i18n="about.tagline"></span></p>
      <p class="muted small" data-i18n="about.unofficial"></p>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="cat.js"></script>
  <script src="components.js"></script>
  <script src="early.js"></script>
  <script src="catfacts.js"></script>
  <script src="earlyui.js"></script>
  <script src="settings.js"></script>
</body>
</html>
