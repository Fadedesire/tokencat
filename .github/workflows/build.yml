# Сборка TokenCat на каждый push: Windows (NSIS + portable) и macOS (universal .app/.dmg).
# Результаты — во вкладке Actions → запуск → Artifacts.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-latest
            name: macos-universal
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Tauri CLI
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx tauri build ${{ matrix.args }}

      - name: Upload (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: TokenCat-windows
          path: |
            app/src-tauri/target/release/tokencat.exe
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload (macOS)
        if: matrix.name == 'macos-universal'
        uses: actions/upload-artifact@v4
        with:
          name: TokenCat-macos-universal
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
